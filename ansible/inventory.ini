[web]
web_server ansible_host=65.0.3.141

[db]
db_server ansible_host=10.0.2.141

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/travelmemory-key
ansible_ssh_extra_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[db:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="ssh -i ~/.ssh/travelmemory-key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p ubuntu@65.0.3.141"'
